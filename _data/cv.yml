    Experience:
      - company: University of Nebraska Medical Center — Shcherbakova Lab
        position: Research Scholar
        location: Omaha, NE, United States
        start_date: 2025-10
        summary: >
          Eppley Institute for Research in Cancer and Allied Diseases, Fred & Pamela Buffett Cancer Center.
        highlights:
          - Build machine-learning classifiers on AACR GENIE targeted-panel data to separate POLE driver from passenger mutations across sequencing panels, nominating candidate novel drivers for functional follow-up.
          - Design biological feature sets from mutation-context data and maintain an end-to-end Python ML framework for tumour subtype classification.
          - Curate and analyse functional evidence for POLE/POLD1 variants; develop and maintain the PolED database and web resource.
          - Engineer yeast strains via genetic editing to assay the function of polymerase variants.
          - Develop reproducible Snakemake pipelines for somatic variant analysis on HPC (UNMC Swan / Holland Computing Center).
          - Contribute to manuscript and grant writing, including technical documentation.

