        icon: fa-solid fa-dna
        keywords: "DNA replication fidelity, POLE/POLD1 proofreading, ultramutation, mismatch repair, hypermutator phenotypes"

      - name: Cancer genomics
        icon: fa-solid fa-chart-simple
        keywords: "Mutational signatures, driver vs. passenger discrimination, somatic variant interpretation, tumour stratification"

      - name: Computational methods
        icon: fa-solid fa-code
        keywords: "Machine learning for genomics, reproducible pipelines, database and web-resource design, data visualisation"

