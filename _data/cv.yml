cv:
  name: Lev Tsarin
  label: Computational Biologist · Cancer Genomics & Genome Stability
  email: tsarinlev@gmail.com
  location: Omaha, NE, United States
  image: ""
  summary: >
    Computational biologist working at the intersection of cancer genomics, genome instability, and
    molecular biology. I study how errors made by the replicative DNA polymerases shape tumour genomes and how we can detect it —
    combining machine learning on tumour sequencing data, curation of the primary functional literature,
    and yeast genetics to connect a variant to the phenotype it causes. First author of PolED, a curated
    database of functional studies of POLE and POLD1 variants in humans.

